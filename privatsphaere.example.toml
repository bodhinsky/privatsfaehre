# Copy to privatsphaere.toml and pass with --config.
# GDPR Art. 9/10 categories (HEALTH, RELIGION, ...) are not configurable:
# setting a threshold for them, allow-listing them or disabling the
# "special" recognizer is rejected as a configuration error.

[detect]
# Minimum score for redaction.
default_threshold = 0.5
# Span texts that are never redacted (case-insensitive, exact match).
allowlist = ["support@example.com", "Musterstadt"]
# Regexes: a span whose full text matches is never redacted.
allow_patterns = ['[A-Z]{2}-\d{4}']
# Terms that are always redacted.
denylist = [
  { text = "Projekt Falke", entity = "ORGANIZATION" },
  { text = "Dr. Hilde Beispiel", entity = "PERSON" },
]
# Recognizer groups to skip (see `privatsphaere scan --candidates`).
disabled_recognizers = []

[detect.thresholds]
DATE = 0.8
URL = 0.9

# Optional local NER (GLiNER on ONNX Runtime). Generate this section with
#   privatsphaere ner-config /path/to/model-dir
# [ner]
# model_dir = "/opt/models/gliner_multi_pii-v1"
# model_sha256 = "…"
# tokenizer_sha256 = "…"
# onnxruntime = "/usr/lib/libonnxruntime.so"
# threshold = 0.3
# Prompts for ordinary entities (special-category prompts are fixed):
# labels = [{ label = "person", entity = "PERSON", min_score = 0.3 }]
