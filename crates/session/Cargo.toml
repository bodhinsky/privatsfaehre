[package]
name = "session"
description = "Review-mode clipboard session: analysis, pseudonymization, reveal, audit log. Shared by CLI and app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ner"]
# GLiNER NER on ONNX Runtime (loaded at run time; nothing is downloaded).
ner = ["dep:gliner"]

[dependencies]
detect.workspace = true
vault.workspace = true
clip.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
gliner = { workspace = true, optional = true }

[lints]
workspace = true
