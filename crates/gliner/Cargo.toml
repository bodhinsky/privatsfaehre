[package]
name = "gliner"
description = "GLiNER span NER on ONNX Runtime (loaded at run time from a local library), offline only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
detect.workspace = true
regex.workspace = true
thiserror.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# load-dynamic: ONNX Runtime is a shared library the user installs; nothing is
# downloaded at build time (the default `download-binaries` would fetch it).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17"] }
# No `http`/`hf-hub` (would download from the Hugging Face hub), no C regex.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[lints]
workspace = true
