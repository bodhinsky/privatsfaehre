[package]
name = "app"
description = "Desktop app: review window and tray icon (review mode). Nothing depends on this crate."
version.workspace = true
edition.workspace = true
# eframe/egui need a newer compiler than the library crates.
rust-version = "1.95"
license.workspace = true
publish.workspace = true

[[bin]]
name = "privatsphaere-app"
path = "src/main.rs"

[features]
default = ["tray"]
# Tray / menu-bar icon. On Linux this needs GTK 3 and libayatana-appindicator.
tray = ["dep:tray-icon", "dep:gtk"]

[dependencies]
detect.workspace = true
vault.workspace = true
clip.workspace = true
session.workspace = true
clap.workspace = true
# No `links` (would open URLs in a browser), no `clipboard` (the app reads the
# clipboard only through `clip`), no `accesskit` (would expose clipboard text to
# the accessibility tree), glow instead of wgpu for a smaller tree.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
tray-icon = { version = "0.26", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[lints]
workspace = true
