[package]
name = "ingest"
description = "Text extraction from documents, e-mails, spreadsheets and data files (pure Rust, offline)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["office", "pdf", "email", "spreadsheet"]
# .docx, .pptx, .odt, .odp (ZIP + XML)
office = ["dep:zip", "dep:quick-xml"]
pdf = ["dep:pdf-extract"]
# .eml, .mbox
email = ["dep:mail-parser"]
# .xlsx, .xlsm, .xls, .ods
spreadsheet = ["dep:calamine"]

[dependencies]
serde_json.workspace = true
csv.workspace = true
thiserror.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.42", optional = true }
pdf-extract = { version = "0.12", optional = true }
mail-parser = { version = "0.11", optional = true }
calamine = { version = "0.37", optional = true }

[lints]
workspace = true
