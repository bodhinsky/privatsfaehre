name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GTK and AppIndicator for the tray icon
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: ONNX Runtime for the GLiNER end-to-end test
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install onnxruntime==1.31.0
          lib=$(python3 -c "import onnxruntime, os, glob; print(glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__), 'capi', 'libonnxruntime.so*'))[0])")
          echo "ORT_DYLIB_PATH=$lib" >> "$GITHUB_ENV"
      - run: cargo test --workspace --all-features

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: No network crates, no UI dependencies, no sockets
        run: scripts/check-offline.sh

  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Art. 9/10 recall must not drop
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/accuracy-gate.sh "origin/${{ github.base_ref }}"
          else
            scripts/accuracy-gate.sh
          fi
